name: Run Fraud Detection Notebook

on:
  push:
    paths:
      - 'DataAnalytics-L2-FraudDetection/notebooks/Fraud_Detection_SMOTE_Logistic_RF.ipynb'
      - 'DataAnalytics-L2-FraudDetection/data/creditcard.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-fraud-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib seaborn scikit-learn imbalanced-learn jupyter nbconvert

      - name: Verify LFS dataset
        working-directory: DataAnalytics-L2-FraudDetection
        run: |
          test -s data/creditcard.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('data/creditcard.csv', nrows=5)
          print('Dataset columns:', list(df.columns))
          print('LFS dataset is available for execution.')
          PY

      - name: Execute notebook from its own directory
        working-directory: DataAnalytics-L2-FraudDetection/notebooks
        run: |
          jupyter nbconvert --to notebook --execute Fraud_Detection_SMOTE_Logistic_RF.ipynb --output Fraud_Detection_SMOTE_Logistic_RF.ipynb --ExecutePreprocessor.timeout=0 --ExecutePreprocessor.kernel_name=python3

      - name: Commit executed notebook and generated results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f DataAnalytics-L2-FraudDetection/notebooks/Fraud_Detection_SMOTE_Logistic_RF.ipynb DataAnalytics-L2-FraudDetection/results/*.png DataAnalytics-L2-FraudDetection/results/*.svg DataAnalytics-L2-FraudDetection/results/*.csv
          git diff --cached --quiet && echo 'No generated changes to commit.' || git commit -m 'Execute fraud detection notebook [skip ci]'
          git push
