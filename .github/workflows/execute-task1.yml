name: Execute Task 1 Notebook

on:
  push:
    paths:
      - '.github/workflows/execute-task1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-task1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: DataAnalytics-L1-EDARetailSales
        run: python -m pip install --upgrade pip && pip install -r requirements.txt nbconvert ipykernel

      - name: Pull LFS datasets
        run: git lfs pull

      - name: Execute Task 1 notebook
        working-directory: DataAnalytics-L1-EDARetailSales
        run: jupyter nbconvert --to notebook --execute EDA_Retail_Sales.ipynb --output EDA_Retail_Sales.ipynb --ExecutePreprocessor.timeout=600 --ExecutePreprocessor.kernel_name=python3

      - name: Commit executed notebook and regenerated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DataAnalytics-L1-EDARetailSales/EDA_Retail_Sales.ipynb DataAnalytics-L1-EDARetailSales/outputs/top_10_products_by_revenue.png
          git diff --cached --quiet || git commit -m "Execute Task 1 notebook and regenerate product revenue chart"
          git push
