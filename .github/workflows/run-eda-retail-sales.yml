name: Run EDA Retail Sales Notebook

on:
  push:
    paths:
      - 'DataAnalytics-L1-EDARetailSales/EDA_Retail_Sales.ipynb'
      - 'DataAnalytics-L1-EDARetailSales/data/**'
      - '.github/workflows/run-eda-retail-sales.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: DataAnalytics-L1-EDARetailSales
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas numpy matplotlib seaborn jupyter nbconvert; fi
          pip install jupyter nbconvert

      - name: Remove redundant Markdown graph embeds
        working-directory: DataAnalytics-L1-EDARetailSales
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('EDA_Retail_Sales.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))
          image_paths = {
              'outputs/monthly_revenue_trend.png',
              'outputs/monthly_aov.svg',
              'outputs/top_10_countries_by_revenue.png',
              'outputs/top_10_countries_by_orders.png',
              'outputs/top_10_products_by_units.png',
              'outputs/top_10_products_by_revenue.png',
              'outputs/correlation_heatmap.png',
          }
          changed = False
          for cell in nb['cells']:
              if cell.get('cell_type') != 'markdown':
                  continue
              source = cell.get('source', [])
              text = ''.join(source)
              lines = text.splitlines(keepends=True)
              filtered = [line for line in lines if not any(f']({img})' in line for img in image_paths)]
              if filtered != lines:
                  cell['source'] = filtered
                  changed = True
          if changed:
              path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
              print('Removed redundant Markdown graph embeds.')
          else:
              print('No redundant Markdown graph embeds found.')
          PY

      - name: Commit notebook presentation fix
        run: |
          git config user.name 'Ntsako Sibanda'
          git config user.email 'sibandantsako1@gmail.com'
          git add DataAnalytics-L1-EDARetailSales/EDA_Retail_Sales.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook presentation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: remove duplicate graph displays from EDA notebook'
          git push origin HEAD:main

      - name: Execute notebook from top to bottom
        working-directory: DataAnalytics-L1-EDARetailSales
        run: |
          jupyter nbconvert --to notebook --execute EDA_Retail_Sales.ipynb --output EDA_Retail_Sales.ipynb --ExecutePreprocessor.timeout=600 --ExecutePreprocessor.kernel_name=python3

      - name: Verify generated outputs and notebook execution
        working-directory: DataAnalytics-L1-EDARetailSales
        run: |
          test -f data/cleaned/online_retail_cleaned.csv
          for f in monthly_revenue_trend.png quarterly_revenue_trend.png monthly_aov.png monthly_aov.svg top_10_countries_by_revenue.png top_10_countries_by_orders.png top_10_products_by_units.png top_10_products_by_revenue.png correlation_heatmap.png; do test -f "outputs/$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          nb = json.loads(Path('EDA_Retail_Sales.ipynb').read_text(encoding='utf-8'))
          code_cells = [c for c in nb['cells'] if c.get('cell_type') == 'code']
          assert code_cells and all(c.get('execution_count') is not None for c in code_cells)
          assert all('outputs' in c for c in code_cells)
          print(f'Executed {len(code_cells)} code cells successfully.')
          PY

      - name: Upload executed notebook and generated outputs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-retail-sales-run
          path: |
            DataAnalytics-L1-EDARetailSales/EDA_Retail_Sales.ipynb
            DataAnalytics-L1-EDARetailSales/data/cleaned/online_retail_cleaned.csv
            DataAnalytics-L1-EDARetailSales/outputs/
          if-no-files-found: error
