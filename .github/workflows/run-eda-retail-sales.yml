name: Run EDA Retail Sales Notebook

on:
  push:
    paths:
      - 'DataAnalytics-L1-EDARetailSales/EDA_Retail_Sales.ipynb'
      - 'DataAnalytics-L1-EDARetailSales/data/**'
      - 'DataAnalytics-L1-EDARetailSales/scripts/**'
      - '.github/workflows/run-eda-retail-sales.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: DataAnalytics-L1-EDARetailSales
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas numpy matplotlib seaborn jupyter nbconvert nbformat; fi
          pip install jupyter nbconvert nbformat

      - name: Improve notebook visuals
        run: python DataAnalytics-L1-EDARetailSales/scripts/improve_notebook_visuals.py

      - name: Execute notebook from top to bottom
        working-directory: DataAnalytics-L1-EDARetailSales
        run: |
          jupyter nbconvert --to notebook --execute EDA_Retail_Sales.ipynb --output EDA_Retail_Sales.ipynb --ExecutePreprocessor.timeout=600 --ExecutePreprocessor.kernel_name=python3

      - name: Verify generated outputs and embedded notebook results
        working-directory: DataAnalytics-L1-EDARetailSales
        run: |
          test -f data/cleaned/online_retail_cleaned.csv
          for f in monthly_revenue_trend.png quarterly_revenue_trend.png monthly_aov.png monthly_aov.svg top_10_countries_by_revenue.png top_10_countries_by_orders.png top_10_products_by_units.png top_10_products_by_revenue.png correlation_heatmap.png; do test -f "outputs/$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          nb = json.loads(Path('EDA_Retail_Sales.ipynb').read_text(encoding='utf-8'))
          code_cells = [c for c in nb['cells'] if c.get('cell_type') == 'code']
          assert code_cells and all(c.get('execution_count') is not None for c in code_cells)
          assert any(c.get('outputs') for c in code_cells), 'Notebook has no embedded outputs.'
          print(f'Executed {len(code_cells)} code cells successfully with embedded outputs.')
          PY

      - name: Commit executed notebook and refreshed visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DataAnalytics-L1-EDARetailSales/EDA_Retail_Sales.ipynb DataAnalytics-L1-EDARetailSales/outputs DataAnalytics-L1-EDARetailSales/data/cleaned/online_retail_cleaned.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Refresh EDA retail sales visuals and embed notebook results"
            git push
          fi

      - name: Upload executed notebook and generated outputs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eda-retail-sales-run
          path: |
            DataAnalytics-L1-EDARetailSales/EDA_Retail_Sales.ipynb
            DataAnalytics-L1-EDARetailSales/data/cleaned/online_retail_cleaned.csv
            DataAnalytics-L1-EDARetailSales/outputs/
          if-no-files-found: error
