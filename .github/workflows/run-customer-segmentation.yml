name: Execute Customer Segmentation Notebook

on:
  workflow_dispatch:
  push:
    paths:
      - 'DataAnalytics-L1-CustomerSegmentation/notebooks/Online_Retail_Customer_Segmentation.ipynb'

permissions:
  contents: write

jobs:
  execute-notebook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DataAnalytics-L1-CustomerSegmentation/requirements.txt
          pip install jupyter nbconvert ucimlrepo

      - name: Patch notebook for current UCI package, OASIS visualisation requirements and canonical output names
        working-directory: DataAnalytics-L1-CustomerSegmentation/notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('Online_Retail_Customer_Segmentation.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          output_name_map = {
              "monthly_revenue_trend.png": "01_monthly_revenue_trend.png",
              "top_10_countries_by_revenue.png": "02_top_10_countries_revenue.png",
              "top_10_products_by_revenue.png": "03_top_10_products_revenue.png",
              "recency_distribution.png": "04_recency_distribution.png",
              "frequency_distribution.png": "05_frequency_distribution.png",
              "monetary_distribution.png": "06_monetary_distribution.png",
              "customers_per_segment.png": "08_customers_per_segment.png",
              "rfm_by_segment.png": "09_average_rfm_by_segment.png",
              "customer_segments_scatter.png": "10_frequency_vs_monetary_segments.png"
          }
          for cell in nb['cells']:
              if cell.get('cell_type') == 'code':
                  src = ''.join(cell.get('source', []))
                  src = src.replace('online_retail.data.features.copy()', 'online_retail.data.original.copy()')
                  src = src.replace('plt.show\\n', 'plt.show()\\n')
                  for old_name, new_name in output_name_map.items():
                      src = src.replace(f"OUTPUTS/'{old_name}'", f"OUTPUTS/'{new_name}'")
                  cell['source'] = src.splitlines(True)
          if not any('Recency vs Frequency' in ''.join(c.get('source', [])) for c in nb['cells']):
              nb['cells'].extend([
                  {'cell_type':'markdown','metadata':{},'source':['### Additional cluster visualisation — Recency vs Frequency\\n','This second feature combination complements Frequency vs Monetary Value and shows how recent activity differs across the customer segments.\\n']},
                  {'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],'source':[
                      'fig, ax = plt.subplots(figsize=(10,6))\\n',
                      'for cluster in sorted(rfm[\\'Cluster\\'].unique()):\\n',
                      '    subset = rfm[rfm[\\'Cluster\\'] == cluster]\\n',
                      '    ax.scatter(subset[\\'Recency\\'], subset[\\'Frequency\\'], label=f\\'Cluster {cluster}\\', alpha=0.6)\\n',
                      'ax.set_title(\\'Customer Segments: Recency vs Frequency\\')\\n',
                      'ax.set_xlabel(\\'Recency (days)\\')\\n',
                      'ax.set_ylabel(\\'Frequency (unique invoices)\\')\\n',
                      'ax.legend(title=\\'Segment\\')\\n',
                      'plt.tight_layout()\\n',
                      "fig.savefig(OUTPUTS/'customer_segments_scatter_recency_frequency.png', dpi=160, bbox_inches='tight')\\n",
                      'plt.show()\\n']}
              ])
          if not any('RecommendedMarketingAction' in ''.join(c.get('source', [])) for c in nb['cells']):
              nb['cells'].extend([
                  {'cell_type':'markdown','metadata':{},'source':['## Customer Segment Profiles & Marketing Actions\\n']},
                  {'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],'source':[
                      'segment_profile = rfm.groupby(\\'Cluster\\')[[\\'Recency\\',\\'Frequency\\',\\'Monetary\\']].mean().round(2)\\n',
                      'rows = []\\n',
                      'for cluster, row in segment_profile.iterrows():\\n',
                      '    if row[\\'Recency\\'] <= rfm[\\'Recency\\'].median() and row[\\'Frequency\\'] >= rfm[\\'Frequency\\'].median() and row[\\'Monetary\\'] >= rfm[\\'Monetary\\'].median():\\n',
                      '        customer_type = \\'High-value / loyal\\'\\n',
                      '        action = \\'Protect with loyalty rewards, early access and personalised cross-sell offers.\\'\\n',
                      '    elif row[\\'Recency\\'] > rfm[\\'Recency\\'].median() and row[\\'Frequency\\'] < rfm[\\'Frequency\\'].median():\\n',
                      '        customer_type = \\'At-risk / inactive\\'\\n',
                      '        action = \\'Run win-back campaigns, reminders and targeted incentives to reactivate.\\'\\n',
                      '    else:\\n',
                      '        customer_type = \\'Developing / opportunity\\'\\n',
                      '        action = \\'Use personalised recommendations, bundles and promotions to increase frequency and value.\\'\\n',
                      '    rows.append([cluster, row[\\'Recency\\'], row[\\'Frequency\\'], row[\\'Monetary\\'], customer_type, action])\\n',
                      "segment_summary = pd.DataFrame(rows, columns=['Cluster','Recency','Frequency','Monetary','CustomerType','RecommendedMarketingAction'])\\n",
                      'display(segment_summary)\\n',
                      "segment_summary.to_csv(OUTPUTS/'segment_profile_and_actions.csv', index=False)\\n"]}
              ])
          p.write_text(json.dumps(nb, ensure_ascii=False, indent=1), encoding='utf-8')
          PY

      - name: Remove legacy duplicate output filenames
        working-directory: DataAnalytics-L1-CustomerSegmentation/outputs
        run: |
          rm -f monthly_revenue_trend.png \
                top_10_countries_by_revenue.png \
                top_10_products_by_revenue.png \
                recency_distribution.png \
                frequency_distribution.png \
                monetary_distribution.png \
                customers_per_segment.png \
                rfm_by_segment.png \
                customer_segments_scatter.png

      - name: Execute notebook from top to bottom
        working-directory: DataAnalytics-L1-CustomerSegmentation/notebooks
        run: |
          jupyter nbconvert --to notebook --execute Online_Retail_Customer_Segmentation.ipynb \
            --output Online_Retail_Customer_Segmentation_executed.ipynb \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3
          mv Online_Retail_Customer_Segmentation_executed.ipynb Online_Retail_Customer_Segmentation.ipynb

      - name: Commit executed notebook and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DataAnalytics-L1-CustomerSegmentation/notebooks/Online_Retail_Customer_Segmentation.ipynb
          git add DataAnalytics-L1-CustomerSegmentation/outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Align Customer Segmentation outputs with notebook"
            git push
          fi
